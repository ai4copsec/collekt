repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Keep `rev` in step with the `ruff` pin in pyproject.toml's dev group, or the
  # hook and `just lint` will reformat each other's output on every commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Strip outputs, execution counts and kernel metadata from notebooks, so
  # commits carry code only and never re-run diffs or embedded result data.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
