name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

# Only one Pages deployment at a time; let a newer push supersede an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/uv-cache
  UV_LINK_MODE: copy

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv --quiet

      - uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-lint-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-lint-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --group dev --frozen --quiet

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      - name: Run ruff
        run: uv run ruff check src/ tests/

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv --quiet

      - uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-test-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --group test --frozen --quiet

      - name: Run tests
        run: >
          uv run pytest tests/ -v --timeout=120
          --cov=collekt --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv --quiet

      - uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-docs-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-docs-${{ runner.os }}-

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install documentation dependencies
        run: uv sync --group docs --frozen --quiet

      - name: Build API reference
        run: uv run quartodoc build --config docs/_quarto.yml

      - name: Render documentation
        run: quarto render docs

      - name: Upload rendered documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy-docs:
    name: Publish documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - docs
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv --quiet

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 30
