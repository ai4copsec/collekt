[project]
name = "collekt"
version = "0.2.0"
description = "A library to facilitate spatio-temporal data collection across arbitrary datasources"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["data source", "collection"]
authors = [
    { name = "Thomas Roehr", email = "roehr@simula.no" },
    { name = "Ola Formo Kihle", email = "kihle@simula.no" },
    { name = "Julien Vitay", email = "julien.vitay@eodyn.com" },
]
maintainers = [
    { name = "Thomas Roehr", email = "roehr@simula.no" },
]
requires-python = ">=3.13"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# collekt installs everything by default: most users want all sources and the
# gridded Assembler. Provider clients are still imported lazily, so importing
# collekt stays fast and degrades gracefully if a dependency is removed.
dependencies = [
    # engine
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "requests",
    "shapely",
    "geopy",
    "rich",
    "tqdm",
    # gridded assembler + GRIB reading
    "xarray>=2026.4.0",
    "scipy>=1.18.0",
    "cfgrib>=0.9.15.1",
    "eccodeslib>=2.47.3.21",
    # tabular feature backend (Skytruth)
    "damast",
    "geopandas",
    "polars",
    # provider clients
    "copernicusmarine>=2.4.1",
    "cdsapi>=0.7.7",
    "ecmwf-opendata>=0.3.30",
    "hozint-apiclient",
    "python-dotenv>=1.2.2",
]

[project.urls]
homepage = "https://ai4copsec.github.io/collekt"
documentation = "https://ai4copsec.github.io/collekt"
repository = "https://github.com/ai4copsec/collekt"

[project.scripts]
collekt = "collekt.cli.main:run"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.format]
docstring-code-format = true  # also format code blocks inside docstrings

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I import sorting · UP pyupgrade
# · B bugbear (likely bugs) · SIM simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length: the formatter already wraps code; don't double-flag long strings/URLs
    "E741",  # allow short math-style names (l, I, O), common in research code
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imports in a package __init__ are re-exports, not dead code

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
version = "0.2.0"
name = "cz_conventional_commits"
version_files = [
    "pyproject.toml:^version = ",
    "src/collekt/version.py:^__version__ = ",
]
tag_format = "$version"
annotated_tag = true
major_version_zero = true
update_changelog_on_bump = false
# Re-lock so uv.lock records the new version and lands in the bump commit
# (hooks run after the version files are written, before the commit).
pre_bump_hooks = ["uv lock && git add uv.lock"]

# Dev-only tooling. uv installs the `dev` group automatically on `uv sync`
# and `uv run`, so `just test` / `just lint` work without extra flags.
[dependency-groups]
test = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]
docs = ["quartodoc>=0.11"]
dev = [
    "ruff>=0.4",
    "commitizen>=3.0",
    { include-group = "test" },
]
notebook = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.6.0",
    "matplotlib>=3.11.0",
]
