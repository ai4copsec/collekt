damast_version: "0.3.7"
columns:
  - name: "mmsi"
    representation_type: "int"
    description: "Maritime Mobile Service Identity (9-digit vessel identifier)"
    is_optional: false

  - name: "base_date_time"
    representation_type: "str"
    description: "Full UTC date and time of the position report - format: %Y-%m-%d %H:%M:%S"
    is_optional: false

  - name: "latitude"
    representation_type: "float"
    description: "Latitude coordinate in decimal degrees (WGS84)"
    is_optional: false
    unit: deg

  - name: "longitude"
    representation_type: "float"
    description: "Longitude coordinate in decimal degrees (WGS84)"
    is_optional: false
    unit: deg

  - name: "sog"
    representation_type: "float"
    description: "Speed over ground in knots"
    is_optional: true
    unit: knots

  - name: "cog"
    representation_type: "float"
    description: "Course over ground in degrees"
    is_optional: true
    unit: deg

  - name: "heading"
    representation_type: "int"
    description: "True heading in degrees (0..359); empty when not available"
    is_optional: true
    unit: deg

  - name: "vessel_name"
    representation_type: "string"
    description: "Name of the vessel as reported in the AIS message"
    is_optional: true

  - name: "imo"
    representation_type: "string"
    description: "International Maritime Organization number, prefixed with 'IMO' (e.g. IMO9935492)"
    is_optional: true

  - name: "call_sign"
    representation_type: "string"
    description: "Vessel radio call sign"
    is_optional: true

  - name: "vessel_type"
    representation_type: "int"
    description: "AIS vessel type code (ITU-R M.1371 ship and cargo type)"
    is_optional: true

  - name: "status"
    representation_type: "int"
    description: "AIS navigational status code (e.g. 0 = under way using engine, 1 = at anchor, 15 = not defined)"
    is_optional: true

  - name: "length"
    representation_type: "int"
    description: "Overall length of the vessel in meters"
    is_optional: true
    unit: m

  - name: "width"
    representation_type: "int"
    description: "Overall width (beam) of the vessel in meters"
    is_optional: true
    unit: m

  - name: "draft"
    representation_type: "float"
    description: "Draft of the vessel in meters"
    is_optional: true
    unit: m

  - name: "cargo"
    representation_type: "int"
    description: "AIS cargo type code"
    is_optional: true

  - name: "transceiver"
    representation_type: "string"
    description: "AIS transceiver class (A or B); empty in files before 2018"
    is_optional: true

annotations:
  id: "marine_cadastre"
  name: "NOAA Marine Cadastre AIS Vessel Traffic Data"
  description: "Daily AIS vessel position reports (broadcast points) in U.S. and international waters, collected by the U.S. Coast Guard and published by BOEM and NOAA as zstd-compressed CSV files."
  provider: "NOAA Office for Coastal Management / BOEM"
  url: "https://hub.marinecadastre.gov/pages/vesseltraffic"
  license: "Public Domain (U.S. Government work)"
