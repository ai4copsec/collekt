# Geonorge maritime vector datasets — open feature sources, one entry per dataset.
#
# Curated for maritime surveillance and pinned by catalogue UUID (`dataset_id`),
# which stays stable across title edits. Each entry is cropped to the request
# bbox and written as GeoParquet; the time window is ignored (static reference
# data) and the entries take no variable selection.
#
# Every entry is a WFS (server-side bbox crop) and names the exact feature types
# to request, so no per-run GetCapabilities call is needed; re-probe an
# endpoint's GetCapabilities only when adding or changing an entry. Features are
# requested in each server's GML default.
#
# Every entry declares the same `coverage`: a box around Norwegian waters
# (mainland Norway and its economic zone, Svalbard and Jan Mayen), so requests
# elsewhere are skipped without querying Geonorge. A box cannot follow the
# border exactly: requests in neighbouring areas inside it (e.g. western Sweden,
# Shetland) still query Geonorge and simply come back empty.

sources:
  # --- navigation & infrastructure
  geonorge_depth_contours:  # Sjøkart - Dybdedata WFS (nautical-chart contours, depth in `dybde`)
    kind: geonorge
    path: "geonorge"
    filename_pattern: "{source}_{bbox_hash}.parquet"
    coverage:
      longitude: [-10.0, 37.0]
      latitude: [56.0, 82.0]
    dataset_id: "9e01fc8e-e1d3-4d11-8b9d-22e1d132ddfe"
    endpoint: "https://wfs.geonorge.no/skwms1/wfs.dybdedata"
    type_names: ["app:Dybdekurve"]
    url: "https://kartkatalog.geonorge.no/metadata/uuid/9e01fc8e-e1d3-4d11-8b9d-22e1d132ddfe"

