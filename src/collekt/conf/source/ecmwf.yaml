# ECMWF atmospheric sources: near-real-time forecast wind (Open Data) and
# reanalysis (ERA5, from the CDS or from Google's ARCO-ERA5 Zarr store).
#
# These are not part of the Copernicus Marine catalogue, so `available_variables`
# is maintained by hand — extend it downstream if you need variables beyond the
# ones listed here. Selecting which to fetch is a downstream decision.

sources:
  ecmwf_open_data_forecast:
    kind: ecmwf_open_data
    path: "ecmwf/open_data"
    # {run} is the date of the run a day is read from: the day itself, or the
    # newest run when the day lies in its forecast. Keeping it in the name stops
    # a forecast file from being reused once the day's own run is published.
    filename_pattern: "ecmwf_open_data_{date:%Y%m%d}_{run}_{time}z_{bbox_hash}.nc"
    dataset_id: "ecmwf-open-data-ifs"
    temporal_sampling: 3h
    # Read from ECMWF's Google Cloud mirror of Open Data, which keeps past runs
    # (ECMWF's own server keeps only the last four days). Coverage starts with
    # IFS cycle 50r1 (2026-05-12); use ERA5 for earlier dates. The AWS mirror
    # (source: aws) throttles range requests with HTTP 503, which the client
    # retries only after 120 s.
    # Days after the newest run come from its forecast: 3-hourly to 6 days
    # ahead, then 6-hourly. The provider always serves the global grid, so
    # downloaded GRIB2 files are cropped to the padded request region and
    # written out as NetCDF.
    coverage:
      start: "2026-05-12"
      end: "now+10d"
    model: ifs
    source: google
    resol: 0p25
    type: fc
    levtype: sfc
    stream: oper
    time: "00"
    steps: [0, 3, 6, 9, 12, 15, 18, 21, 24]
    pad_deg: 0.5
    available_variables: [10u, 10v, 10fg, 100u, 100v]
    url: "https://www.ecmwf.int/en/forecasts/datasets/open-data"

  # Freshest IFS value at every 3-hourly time step, from all four daily runs:
  # a time is read from its own run once published (lead 0 h or +3 h), and
  # from the newest run's forecast before that. A newer run replaces the
  # forecast values it covers. {run} is the newest run a day file uses and
  # {hours} the hours it spans (e.g. 00-21, or 00-06_12-21 around a gap).
  # Cropped pieces (one per run and lead time) are cached under
  # <output.root>/<path>/pieces/ for every request.
  ecmwf_ifs_latest_0p25:
    kind: ecmwf_open_data_latest
    path: "ecmwf/ifs_latest_0p25"
    filename_pattern: "ecmwf_ifs_latest_0p25_{date:%Y%m%d}_{hours}_{run}_{bbox_hash}.nc"
    dataset_id: "ecmwf-open-data-ifs"
    temporal_sampling: 3h
    # Google Cloud mirror, from IFS cycle 50r1 (2026-05-12; use ERA5 before).
    # A run is published about 7 h after its start, and its forecast reaches
    # 144 h (06/18 UTC) or 360 h (00/12 UTC).
    coverage:
      start: "2026-05-12"
      end: "now+5d"
    model: ifs
    source: google
    resol: 0p25
    type: fc
    levtype: sfc
    stream: oper
    pad_deg: 0.5
    available_variables: [10u, 10v, 10fg, 100u, 100v]
    url: "https://www.ecmwf.int/en/forecasts/datasets/open-data"

  # Same at 0.1 degree, published since 2026-10-21, about 2 h after 0.25 degree.
  ecmwf_ifs_latest_0p1:
    kind: ecmwf_open_data_latest
    path: "ecmwf/ifs_latest_0p1"
    filename_pattern: "ecmwf_ifs_latest_0p1_{date:%Y%m%d}_{hours}_{run}_{bbox_hash}.nc"
    dataset_id: "ecmwf-open-data-ifs"
    temporal_sampling: 3h
    coverage:
      start: "2026-10-21"
      end: "now+5d"
    model: ifs
    source: google
    resol: 0p1
    type: fc
    levtype: sfc
    stream: oper
    pad_deg: 0.5
    available_variables: [10u, 10v, 10fg, 100u, 100v]
    url: "https://www.ecmwf.int/en/forecasts/datasets/open-data"

  era5_reanalysis:
    kind: era5
    path: "ecmwf/era5"
    dataset_id: "reanalysis-era5-single-levels"
    temporal_sampling: 1h
    # ERA5 is global and spans 1940 to roughly five days ago (ERA5T latency).
    coverage:
      start: "1940-01-01"
      end: "now-5d"
    pad_deg: 0.5
    data_format: netcdf
    download_format: unarchived
    available_variables:
      - 10m_u_component_of_wind
      - 10m_v_component_of_wind
      - 100m_u_component_of_wind
      - 100m_v_component_of_wind
      - 2m_temperature
      - mean_sea_level_pressure
      - sea_surface_temperature
    url: "https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels"
    doi: "10.24381/cds.adbb2d47"

  era5_arco_reanalysis:
    kind: era5_arco
    path: "ecmwf/era5_arco"
    dataset_id: "arco-era5"
    temporal_sampling: 1h
    # The same ERA5 reanalysis, read anonymously from Google's analysis-ready
    # Zarr copy instead of the CDS queue. Each chunk is one global hour of one
    # variable: fast for short windows, costly for long series over small
    # regions (prefer era5_reanalysis there). The store trails real time by
    # about a week; downloads check its own `valid_time_stop_era5t` attribute,
    # so `end` below only shapes dry-run plans.
    coverage:
      start: "1940-01-01"
      end: "now-7d"
    store: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
    pad_deg: 0.5
    available_variables:
      - 10m_u_component_of_wind
      - 10m_v_component_of_wind
      - 100m_u_component_of_wind
      - 100m_v_component_of_wind
      - 2m_temperature
      - mean_sea_level_pressure
      - sea_surface_temperature
    url: "https://github.com/google-research/arco-era5"
