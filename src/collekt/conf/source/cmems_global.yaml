# Copernicus Marine — global products.
#
# Near-real-time (`*_nrt`) and reanalysis / multi-year (`*_my`) datasets are
# separate sources; picking one for a given date is a downstream decision. Each
# source advertises its `available_variables` (harvested from the Copernicus
# Marine catalogue); choosing which to fetch — and, for `has_depth` sources, a
# `depth: [min, max]` — is left to downstream. Refresh the harvested lists with
# `collekt doctor --online`.
#
# `has_depth` marks a real depth *selection*, not merely the presence of a depth
# coordinate. CMEMS ships its surface datasets (`-2D`, `merged-uv`) with a single
# degenerate depth level, so those declare `has_depth: false` rather than asking
# a caller to pick a range out of one value.
#
# Naming: the daily mean is the unsuffixed base entry (`cmems_glorys_nrt`), and
# every subdaily variant of it carries both its dimensionality and its cadence
# (`..._2d_hourly`, `..._3d_6h`) — dimensionality is what decides whether a
# caller must pass a `depth`, so it belongs in the key. A dataset holding a
# different quantity rather than another cadence of the same field is named for
# the quantity instead (`cmems_glorys_nrt_total_currents`).
# `cmems_med_currents_nrt_15min` predates this rule and keeps its released name.

sources:
  cmems_glorys_nrt:
    kind: cmems
    path: "cmems/global/glorys"
    dataset_id: "cmems_mod_glo_phy-cur_anfc_0.083deg_P1D-m"
    temporal_sampling: 24h
    coverage:
      longitude: [-180, 179.916687]
      latitude: [-80, 90]
      temporal:
        start: "2022-06-01"
        end: null
        kind: rolling
    coordinates_selection_method: inside
    has_depth: true
    available_variables: [uo, vo]
    url: "https://data.marine.copernicus.eu/product/GLOBAL_ANALYSISFORECAST_PHY_001_024/description"
    doi: "10.48670/moi-00016"

