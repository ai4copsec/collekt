# Copernicus Marine — Atlantic Iberian-Biscay-Ireland regional products.
#
# The catalogue follows the CMEMS product split. Analysis/forecast products map
# to one source each; Atlantic ocean-colour observations are split into separate
# near-real-time (`*_nrt`) and multi-year (`*_my`) sources.

sources:
  cmems_ibi_currents:
    kind: cmems
    path: "cmems/atlantic/ibi/currents"
    dataset_id: "cmems_mod_ibi_phy_anfc_0.027deg-3D_P1D-m"
    temporal_sampling: 24h
    coverage:
      longitude: [-19.082841, 5.084567]
      latitude: [26.165357, 56.082942]
      temporal:
        start: "2022-11-23"
        end: null
        kind: rolling
    coordinates_selection_method: inside
    has_depth: true
    available_variables: [bottomT, mlotst, so, thetao, uo, vo, zos]
    url: "https://data.marine.copernicus.eu/product/IBI_ANALYSISFORECAST_PHY_005_001/description"
    doi: "10.48670/moi-00027"

  cmems_ibi_currents_2d_hourly:
