# eOdyn products.
#
# OSmose surface currents. A production API is planned; until it exists the
# adapter serves a frozen historical L4 archive (`mode: archive`), limited to
# the western Mediterranean for April-August 2023, and skips requests outside
# that coverage. Point `archive_root` at the local archive, or switch to
# `mode: api` once the API is available. Not part of the Copernicus Marine
# catalogue, so `available_variables` is maintained by hand.

sources:
  eodyn_osmose_currents:
    kind: eodyn
    path: "eodyn/osmose"
    dataset_id: "EODYN-OS-VELOCITY-L4"
    mode: archive
    archive_root: "$HOME/Research/Currents/OSmose/results/MARES/causal"
    day_pattern: "{date:%Y%m%d}_MARES/{date:%Y%m%d}_MARES_osmose_L4.nc"
    coverage:
      west: -6.0
      east: 20.0
      south: 35.0
      north: 45.0
      start: "2023-04-01"
      end: "2023-08-31"
    temporal_sampling: 24h
    available_variables: [totalewct, totalnsct, ewct, nsct, totalspeed, posterior_std]
    url: "https://www.eodyn.com"
