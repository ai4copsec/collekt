# eOdyn products.
#
# OSmose L4 surface currents, read from eOdyn's Ocean Data Access (ODA) API:
# one NetCDF per 3-hour analysis time on a 0.05 deg grid over the western
# Mediterranean. Needs ODA_USERNAME / ODA_PASSWORD (shell or .env). Coverage is
# read live from ODA; the `coverage` block below is only the fallback used when
# ODA cannot be reached while planning. Not part of the Copernicus Marine
# catalogue, so `available_variables` is maintained by hand.

sources:
  eodyn_osmose_currents:
    kind: eodyn
    path: "eodyn/osmose"
    dataset_id: "EODYN-OS-VELOCITY-L4"
    oda_dataset: "current-os-osmose-l4"
    coverage:
      west: -6.0
      east: 20.0
      south: 35.0
      north: 45.0
      start: "2026-11-20"
      end: "now-1d"
    temporal_sampling: 3h
    available_variables:
      [ewct, nsct, speed, totalewct, totalnsct, totalspeed, ci, posterior_std, quality, blending]
    url: "https://oda.eodyn.com"
