# collekt base configuration.
#
# Output/cache defaults plus the curated source catalogs collekt ships. Downstream
# users select from these sources (by name, e.g. `--datasource cmems_duacs_my`) and
# extend or override them via a `conf_dir` overlay or `get_config(overrides=...)`.
# Curated presets and variable-group tagging are left to downstream. See
# docs/products.qmd.

output:
  root: "data/collections"
  request_pattern: "{start:%Y%m%d}_{end:%Y%m%d}_{sampling}_{bbox_hash}"
  manifest_name: "manifest.json"

cache:
  reuse_existing: true
  overwrite: false
  strict: false

credentials:
  cdsapi_rc: "$HOME/.cdsapirc"
  copernicusmarine_credentials_file: null

source_catalogs: [cmems_global, cmems_med, cmems_ibi, cmems_nws, ecmwf, eodyn, skytruth, dataspace]
